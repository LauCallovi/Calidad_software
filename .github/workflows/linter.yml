name: Python Linter Quality Gate

# El Action se dispara cuando se abre o actualiza una Pull Request hacia main
on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ajusta esto a tu versión de Python

      - name: Instalar dependencias y linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint
          # Si tienes un requirements.txt, descomenta la siguiente línea:
          # pip install -r requirements.txt

      - name: Ejecutar Ruff (Linter y formateador rápido)
        run: ruff check .

      - name: Ejecutar Pylint (Análisis de código estático)
        run: pylint **/*.py