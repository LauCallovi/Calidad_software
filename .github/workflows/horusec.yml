name: Horusec SAST

on:
  push:
    branches: [main]
  pull_request:

jobs:
  horusec:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Compilar Horusec desde main (v2.8.0 tiene un bug con Docker moderno)
        run: |
          git clone --depth 1 https://github.com/ZupIT/horusec.git /tmp/horusec
          cd /tmp/horusec
          CGO_ENABLED=0 go build -buildvcs=false -o /tmp/horusec-fixed ./cmd/app

      - name: Ejecutar Horusec
        run: |
          /tmp/horusec-fixed start -p . \
            -i="**/.venv/**,**/venv/**,**/__pycache__/**,**/node_modules/**" \
            -s="LOW" \
            -e \
            -o="text" -O="horusec-report.txt"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horusec-report
          path: horusec-report.txt